name: Windows installer

# Builds Squirrel.msi and adds it to a release. scripts/release.sh publishes the
# other apps from a Mac, but the MSI can only be packaged on Windows.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to add the installer to, e.g. v1.6.5
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  engine:
    # The download engine cross-builds on Linux: FFmpeg with mingw-w64, and Python
    # and its packages as Windows builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: ./desktop/scripts/build_runtime.sh windows-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-windows-x86_64
          path: desktop/build/runtime-windows-x86_64
          include-hidden-files: true
          retention-days: 1

  installer:
    needs: engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: runtime-windows-x86_64
          path: desktop/build/runtime-windows-x86_64
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Package the MSI
        working-directory: desktop/windows
        shell: pwsh
        # Compose downloads the WiX Toolset itself
        run: .\gradlew.bat packageMsi "-PappVersion=$($env:TAG.TrimStart('v'))" --no-daemon
      - name: Add it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp desktop/windows/build/compose/binaries/main/msi/*.msi Squirrel.msi
          gh release upload "$TAG" Squirrel.msi --clobber
