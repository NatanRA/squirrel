name: Windows installer

# Builds Squirrel-Setup.exe and adds it to a release. scripts/release.sh publishes the
# other apps from a Mac, but the Windows installer can only be packaged on Windows.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to add the installer to, e.g. v1.6.5
        required: true
      test:
        description: Build the chosen branch instead and keep the installer as a workflow artifact, without touching the release
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # What to build: the release's tag, or the branch the workflow was started on for a test
  SOURCE: ${{ inputs.test && github.ref || github.event.release.tag_name || inputs.tag }}

jobs:
  engine:
    # The download engine cross-builds on Linux: FFmpeg with mingw-w64, and Python
    # and its packages as Windows builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: ./desktop/scripts/build_runtime.sh windows-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-windows-x86_64
          path: desktop/build/runtime-windows-x86_64
          include-hidden-files: true
          retention-days: 1

  installer:
    needs: engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
      - uses: actions/download-artifact@v4
        with:
          name: runtime-windows-x86_64
          path: desktop/build/runtime-windows-x86_64
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the app
        working-directory: desktop/windows
        shell: pwsh
        run: .\gradlew.bat createDistributable "-PappVersion=$($env:TAG.TrimStart('v'))" --no-daemon
      - name: Package the installer
        working-directory: desktop/windows
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=$($env:TAG.TrimStart('v'))" packaging\squirrel.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: ls -l desktop/windows/build/installer/Squirrel-Setup.exe
        shell: bash
      - name: Add it to the release
        if: ${{ !inputs.test }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" desktop/windows/build/installer/Squirrel-Setup.exe --clobber
      - name: Keep it as an artifact (test build)
        if: ${{ inputs.test }}
        uses: actions/upload-artifact@v4
        with:
          name: Squirrel-Setup
          path: desktop/windows/build/installer/Squirrel-Setup.exe
          retention-days: 7
