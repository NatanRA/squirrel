name: Windows installer

# Builds Squirrel.msi and adds it to a release. scripts/release.sh publishes the
# other apps from a Mac, but the MSI can only be packaged on Windows.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to add the installer to, e.g. v1.6.5
        required: true
      test:
        description: Build the chosen branch instead and keep the MSI as a workflow artifact, without touching the release
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # What to build: the release's tag, or the branch the workflow was started on for a test
  SOURCE: ${{ inputs.test && github.ref || github.event.release.tag_name || inputs.tag }}

jobs:
  engine:
    # The download engine cross-builds on Linux: FFmpeg with mingw-w64, and Python
    # and its packages as Windows builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: ./desktop/scripts/build_runtime.sh windows-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-windows-x86_64
          path: desktop/build/runtime-windows-x86_64
          include-hidden-files: true
          retention-days: 1

  installer:
    needs: engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
      - uses: actions/download-artifact@v4
        with:
          name: runtime-windows-x86_64
          path: desktop/build/runtime-windows-x86_64
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the app
        working-directory: desktop/windows
        shell: pwsh
        # unzipWix: Compose downloads the WiX Toolset that jpackage needs for MSIs
        run: .\gradlew.bat createDistributable unzipWix "-PappVersion=$($env:TAG.TrimStart('v'))" --no-daemon
      - name: Package the MSI
        working-directory: desktop/windows
        shell: pwsh
        # jpackage directly rather than Compose's packageMsi, which can't take packaging/main.wxs
        # (Squirrel's artwork and stronger compression). The options match build.gradle.kts.
        run: |
          $env:SQUIRREL_PACKAGING = (Resolve-Path packaging).Path
          $wix = (Get-ChildItem build -Recurse -Filter candle.exe | Select-Object -First 1).DirectoryName
          $env:PATH = "$wix;$env:PATH"
          $version = $env:TAG.TrimStart('v')
          & "$env:JAVA_HOME\bin\jpackage.exe" --type msi `
            --app-image build\compose\binaries\main\app\Squirrel --dest build\msi `
            --name Squirrel --app-version $version --vendor Squirrel `
            --description "Download videos and audio with yt-dlp" `
            --win-per-user-install --win-menu --win-menu-group Squirrel --win-shortcut `
            --win-upgrade-uuid 6f1d8f0e-3f7b-4a55-9c0e-5b8f2f4e1a7d `
            --resource-dir packaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: cp desktop/windows/build/msi/*.msi Squirrel.msi && ls -l Squirrel.msi
        shell: bash
      - name: Add it to the release
        if: ${{ !inputs.test }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" Squirrel.msi --clobber
      - name: Keep it as an artifact (test build)
        if: ${{ inputs.test }}
        uses: actions/upload-artifact@v4
        with:
          name: Squirrel-msi
          path: Squirrel.msi
          retention-days: 7
