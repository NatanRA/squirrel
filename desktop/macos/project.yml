name: Squirrel
options:
  bundleIdPrefix: com.natan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Squirrel:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
    dependencies:
      - sdk: VideoToolbox.framework
      - target: SquirrelShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.natan.squirrel
        PRODUCT_NAME: Squirrel
        # One architecture per build: the bundled Python engine is per-architecture
        ARCHS: $(NATIVE_ARCH_ACTUAL)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Not sandboxed: the app runs its bundled Python engine and registers it
        # with installed browsers for the extension (see NativeMessaging.swift)
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Squirrel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: Squirrel is open source. Powered by yt-dlp and FFmpeg.
        CFBundleURLTypes:
          - CFBundleURLName: com.natan.squirrel
            # squirrel://download?url=…, sent by the Share menu extension
            CFBundleURLSchemes: [squirrel]
    postBuildScripts:
      - name: Embed engine
        script: "\"$PROJECT_DIR/scripts/embed_runtime.sh\""
        basedOnDependencyAnalysis: false

  # "Squirrel" in the Share menu; hands links to the app (see ShareViewController.swift)
  SquirrelShare:
    type: app-extension
    platform: macOS
    sources:
      - path: ShareExtension
    entitlements:
      path: ShareExtension/SquirrelShare.entitlements
      properties:
        # Extensions must be sandboxed
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.natan.squirrel.share
        PRODUCT_NAME: SquirrelShare
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Squirrel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
