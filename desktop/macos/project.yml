name: Squirrel
options:
  bundleIdPrefix: app
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Squirrel:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
      # The browser extension, copied out for "Load unpacked" (Browsers.swift)
      - path: ../../extension
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: VideoToolbox.framework
      - sdk: SafariServices.framework
      - target: SquirrelShare
      - target: SquirrelSafari
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.squirrel
        PRODUCT_NAME: Squirrel
        # One architecture per build: the bundled Python engine is per-architecture
        ARCHS: $(NATIVE_ARCH_ACTUAL)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Not sandboxed: the app runs its bundled Python engine and registers it
        # with installed browsers for the extension (see NativeMessaging.swift)
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Squirrel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: Squirrel is open source. Powered by yt-dlp and FFmpeg.
        CFBundleURLTypes:
          - CFBundleURLName: app.squirrel
            # squirrel://download?url=…, sent by the Share menu and Safari extensions
            CFBundleURLSchemes: [squirrel]
        # Services › Download with Squirrel, for selected text containing a link (AppDelegate)
        NSServices:
          - NSMenuItem:
              default: Download with Squirrel
            NSMessage: downloadWithSquirrel
            NSPortName: Squirrel
            NSSendTypes: [NSStringPboardType, NSURLPboardType, public.utf8-plain-text, public.url]
            NSRequiredContext:
              NSTextContent: URL
    postBuildScripts:
      - name: Embed engine
        script: "\"$PROJECT_DIR/scripts/embed_runtime.sh\""
        basedOnDependencyAnalysis: false

  # "Squirrel" in the Share menu; hands links to the app (see ShareViewController.swift)
  SquirrelShare:
    type: app-extension
    platform: macOS
    sources:
      - path: ShareExtension
    entitlements:
      path: ShareExtension/SquirrelShare.entitlements
      properties:
        # Extensions must be sandboxed
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.squirrel.share
        PRODUCT_NAME: SquirrelShare
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Squirrel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true

  # Squirrel's Safari extension: a toolbar button and "Download with Squirrel" when right-clicking.
  # The web part is extension/safari; SafariWebExtensionHandler hands links to the app.
  SquirrelSafari:
    type: app-extension
    platform: macOS
    sources:
      - path: SafariExtension
      - path: ../../extension/safari
        buildPhase: resources
      - path: ../../extension/icons
        buildPhase: resources
    dependencies:
      - sdk: SafariServices.framework
    entitlements:
      path: SafariExtension/SquirrelSafari.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.squirrel.safari
        PRODUCT_NAME: SquirrelSafari
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
    info:
      path: SafariExtension/Info.plist
      properties:
        CFBundleDisplayName: Squirrel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
