name: Squirrel
options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Squirrel:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Bridge
      - path: ../shared/native
      - path: App/Assets.xcassets
      # Shared with the Android app; bundled as "pybridge"
      - path: ../shared/pybridge
        type: folder
        buildPhase: resources
      - path: Vendor/app_packages
        type: folder
        buildPhase: resources
    dependencies:
      - target: SquirrelShare
      - framework: Vendor/Python.xcframework
        embed: true
      - framework: Vendor/FFmpeg.xcframework
        embed: false
      - sdk: libz.tbd
      - sdk: VideoToolbox.framework
      - sdk: JavaScriptCore.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.squirrel
        PRODUCT_NAME: Squirrel
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridge/Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "\"$(BUILT_PRODUCTS_DIR)/Python.framework/Headers\""
          - "\"$(PROJECT_DIR)/Vendor/FFmpeg.xcframework/ios-arm64/Headers\""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
        # utils.sh copies lib-$ARCHS, so each build must be single-arch.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Squirrel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Same colour as the launch animation (LaunchSplash.swift) that follows it
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Expose Documents in the Files app
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: Save downloaded videos to your photo library.
        # Read access is only asked for when deleting a download that's in Photos
        NSPhotoLibraryUsageDescription: Delete videos from your photo library when you delete them in Squirrel.
        ITSAppUsesNonExemptEncryption: false
        # iOS 26 continued-processing tasks for downloads (see BackgroundContinuation.swift)
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).download.*
        UIBackgroundModes: [processing]
        CFBundleURLTypes:
          - CFBundleURLName: app.squirrel
            # squirrel://download?url=…; ytdlp:// still works from before the rename
            CFBundleURLSchemes: [squirrel, ytdlp]
    postBuildScripts:
      - name: Install Python
        script: "\"$PROJECT_DIR/scripts/install_python.sh\""
        basedOnDependencyAnalysis: false

  # "Squirrel" in the share sheet; hands links to the app (see ShareViewController.swift)
  SquirrelShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.squirrel.share
        PRODUCT_NAME: SquirrelShare
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Squirrel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
